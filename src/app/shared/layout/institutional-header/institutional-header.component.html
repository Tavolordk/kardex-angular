<header class="institutional-header">
  <div class="brand-zone">
    <img [src]="assets.branding.seguridad" alt="Seguridad - Secretaría de Seguridad y Protección Ciudadana" />
  </div>
  <h1>Kárdex SSPC</h1>
  <div class="user-zone">
    <div class="user-copy">
      <strong>{{ displayName }}</strong>
      <span>{{ role }}</span>
    </div>
    <span class="avatar">{{ initials }}</span>
    <button class="icon-button" type="button" aria-label="Cerrar sesión" (click)="logoutRequested.emit()">
      <img [src]="assets.icons.logout" alt="" />
    </button>
  </div>
</header>
