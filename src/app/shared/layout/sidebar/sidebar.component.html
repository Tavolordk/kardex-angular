<aside class="sidebar" [class.sidebar--closed]="!open()">
  <div class="sidebar-title">
    <span>MÓDULOS</span>
    <button type="button" (click)="toggled.emit()" aria-label="Contraer o expandir menú" [attr.aria-expanded]="open()">
      <img [src]="assets.icons.collapse" alt="" />
    </button>
  </div>
  <nav aria-label="Módulos principales">
    @for (item of items; track item.title) {
      @if (item.path) {
        <a class="menu-item" [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }" [attr.title]="item.title">
          <span class="menu-icon"><img [src]="item.icon" alt="" /></span>
          <span class="menu-copy"><strong>{{ item.title }}</strong><small>{{ item.description }}</small></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      } @else {
        <span class="menu-item menu-item--disabled" [attr.title]="item.title + ': módulo pendiente de integración'" aria-disabled="true">
          <span class="menu-icon"><img [src]="item.icon" alt="" /></span>
          <span class="menu-copy"><strong>{{ item.title }}</strong><small>{{ item.description }}</small></span>
        </span>
      }
    }
  </nav>
</aside>
